name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          package_version=$(node -p "require('./package.json').version")
          existing_tag=$(git tag --points-at "$SHA" --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)

          if [ -n "$existing_tag" ]; then
            version="${existing_tag#v}"
          elif [ "$EVENT_NAME" = "push" ]; then
            latest_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
            base_version="${latest_tag#v}"
            base_version="${base_version:-$package_version}"
            version=$(node -e "const [major, minor, patch] = process.argv[1].split('.').map(Number); console.log([major, minor, patch + 1].join('.'))" "$base_version")
            git tag -a "v$version" "$SHA" -m "Release v$version"
            git push origin "v$version"
          else
            version="$package_version"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
  build:
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_PATH: /piano/
          VITE_APP_VERSION: ${{ needs.version.outputs.version }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
